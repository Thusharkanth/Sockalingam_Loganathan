<style>
:root {
  --navy: #0b1f3b;
  --navy-deep: #061326;
  --gold: #c8a24a;
  --gold-light: #e2c06e;
  --white: #ffffff;
  --muted: rgba(255,255,255,.66);
  --serif: 'Playfair Display', Georgia, serif;
  --sans: 'Jost', Arial, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { min-height: 100%; }

body {
  min-height: 100vh;
  font-family: var(--sans);
  color: var(--white);
  background:
    radial-gradient(circle at 50% -12%, rgba(226,192,110,.24), transparent 24rem),
    linear-gradient(145deg, #061326 0%, #0b1f3b 54%, #07182e 100%);
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.045'/%3E%3C/svg%3E");
}

a { color: inherit; }

.page {
  position: relative;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 28px 16px;
}

.card-wrap {
  width: min(420px, 100%);
  animation: cardEnter .75s cubic-bezier(.22,1,.36,1) both;
}

.digital-card {
  position: relative;
  min-height: 670px;
  overflow: hidden;
  border-radius: 28px;
  border: 1px solid rgba(226,192,110,.36);
  background:
    linear-gradient(150deg, rgba(255,255,255,.08), transparent 24%),
    linear-gradient(180deg, rgba(11,31,59,.96), rgba(6,19,38,.98));
  box-shadow: 0 26px 70px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.08);
}

.digital-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 10px;
  background: linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold));
}

.digital-card::after {
  content: '';
  position: absolute;
  inset: 18px;
  border: 1px solid rgba(226,192,110,.18);
  border-radius: 20px;
  pointer-events: none;
}

.top {
  position: relative;
  padding: 44px 30px 24px;
  text-align: center;
}

.status {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 22px;
  padding: 8px 14px;
  border: 1px solid rgba(226,192,110,.24);
  border-radius: 999px;
  background: rgba(200,162,74,.08);
  color: var(--gold-light);
  font-size: .63rem;
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;
}

.status::before {
  content: '';
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--gold-light);
  box-shadow: 0 0 16px rgba(226,192,110,.8);
}

.avatar-ring {
  position: relative;
  width: 184px;
  height: 184px;
  margin: 0 auto 20px;
  padding: 8px;
  border-radius: 50%;
  background: linear-gradient(145deg, var(--gold-light), rgba(200,162,74,.24), var(--gold));
  box-shadow: 0 20px 44px rgba(0,0,0,.34);
}

.avatar-ring::after {
  content: '';
  position: absolute;
  inset: -10px;
  border: 1px dashed rgba(226,192,110,.28);
  border-radius: 50%;
}

.avatar-ring img {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top center;
  border-radius: 50%;
  border: 4px solid var(--navy-deep);
  filter: grayscale(12%) contrast(1.04);
}

.name {
  font-family: var(--serif);
  font-size: clamp(2.1rem, 11vw, 3.2rem);
  line-height: .98;
  font-weight: 900;
  letter-spacing: 0;
}

.name em {
  display: block;
  color: var(--gold);
  font-style: italic;
  font-weight: 700;
}

.role {
  margin: 14px auto 0;
  max-width: 310px;
  color: var(--muted);
  font-size: .88rem;
  line-height: 1.6;
  letter-spacing: .04em;
}

.divider {
  height: 1px;
  margin: 4px 30px 0;
  background: linear-gradient(90deg, transparent, rgba(226,192,110,.38), transparent);
}

.details {
  padding: 24px 30px 28px;
}

.meta-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 20px;
}

.meta {
  min-height: 76px;
  display: grid;
  align-content: center;
  padding: 12px 8px;
  border: 1px solid rgba(226,192,110,.16);
  border-radius: 14px;
  background: rgba(255,255,255,.035);
  text-align: center;
}

.meta strong {
  display: block;
  font-family: var(--serif);
  color: var(--gold-light);
  font-size: 1.35rem;
  line-height: 1;
}

.meta span {
  display: block;
  margin-top: 7px;
  color: rgba(255,255,255,.48);
  font-size: .55rem;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
}

.info-list {
  display: grid;
  gap: 10px;
  margin-bottom: 20px;
}

.info {
  display: grid;
  grid-template-columns: 34px 1fr;
  align-items: center;
  gap: 10px;
  min-height: 46px;
  padding: 8px 10px;
  border: 1px solid rgba(226,192,110,.13);
  border-radius: 14px;
  background: rgba(6,19,38,.42);
  color: rgba(255,255,255,.72);
  text-decoration: none;
  font-size: .82rem;
}

.info span:first-child {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: rgba(200,162,74,.14);
  color: var(--gold-light);
  font-size: .72rem;
  font-weight: 800;
}

.actions {
  display: grid;
  gap: 10px;
}

.btn {
  min-height: 50px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 13px 18px;
  border-radius: 16px;
  text-decoration: none;
  font-size: .76rem;
  font-weight: 800;
  letter-spacing: .13em;
  text-transform: uppercase;
  transition: transform .25s ease, background .25s ease, border-color .25s ease;
}

.btn-main {
  background: var(--gold);
  color: var(--navy);
  box-shadow: 0 14px 32px rgba(200,162,74,.22);
}

.btn-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.btn-ghost {
  border: 1px solid rgba(226,192,110,.26);
  color: var(--gold-light);
  background: rgba(255,255,255,.025);
}

.btn:hover,
.info:hover {
  transform: translateY(-2px);
}

.btn-main:hover {
  background: var(--gold-light);
}

.share-url {
  margin-top: 14px;
  color: rgba(255,255,255,.38);
  text-align: center;
  font-size: .68rem;
  letter-spacing: .08em;
}

@keyframes cardEnter {
  from { opacity: 0; transform: translateY(24px) scale(.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@media (max-width: 440px) {
  .page { padding: 14px; }
  .digital-card { min-height: auto; border-radius: 24px; }
  .top { padding: 38px 22px 22px; }
  .details { padding: 22px; }
  .avatar-ring { width: 160px; height: 160px; }
  .meta-grid { grid-template-columns: 1fr; }
  .meta { min-height: 62px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

        <section class="top">

  </main>
</body>
